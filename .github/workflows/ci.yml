name: ci

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - run: dotnet restore src/dotnet/PersonalTechBrief.sln --locked-mode
      - run: dotnet build src/dotnet/PersonalTechBrief.sln --configuration Release --no-restore
      - run: dotnet test src/dotnet/PersonalTechBrief.sln --configuration Release --no-build
      - run: dotnet format src/dotnet/PersonalTechBrief.sln --verify-no-changes --no-restore

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/python/intelligence-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check "uv==0.12.13"
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet

  container-build:
    runs-on: ubuntu-latest
    needs: [dotnet, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file infra/containers/dotnet-web.Dockerfile --tag personal-tech-brief-web:ci .
      - run: docker build --file infra/containers/python-intelligence.Dockerfile --tag personal-tech-brief-python:ci .
